name: Phase 0 CI

on:
  push:
    branches: [master, main]
  # Every pull request, whatever it targets. Restricted to [master, main], a PR
  # opened against another branch — any stacked PR — got NO checks at all and
  # reported as such, which reads identically to "nothing to run". Gating is the
  # point of this workflow; a PR it silently skips is the one failure mode it
  # cannot have.
  pull_request:
    branches: ['**']

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: py_compile all Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: execution audit validation matrix
        run: python3 scripts/execution_audit.py --validate

      # ---------------------------------------------------------------------
      # G-3 — FIXTURE / LIVE SEPARATION
      # (docs/ledger-truncation-forensics-2026-08-17.md §7)
      # Every step below that RUNS the pipeline runs against a scratch root.
      # They used to run against data/ — the live working ledger — which is how
      # the pinned 2026-08-10 determinism run silently deleted 2026-08-11 from
      # it in 0051b5e6. A determinism proof must not be able to write the thing
      # it is measuring. The last step in this job asserts exactly that.
      # ---------------------------------------------------------------------
      - name: seed the CI scratch root
        env:
          FLEET_ROOT: /tmp/fleet-scratch
        run: scripts/ci/seed_scratch_root.sh "$FLEET_ROOT"

      - name: build ledger for 2026-08-10 (scratch root)
        env:
          FLEET_ROOT: /tmp/fleet-scratch
        run: |
          python3 scripts/build_ledger.py --root "$FLEET_ROOT" 2026-08-10 --allow-rewind
          python3 - <<'PY'
          import csv, json, os, sys
          root = os.environ['FLEET_ROOT']
          trades = list(csv.DictReader(open(os.path.join(root, 'data/trades.csv'))))
          meta = json.load(open(os.path.join(root, 'data/ledger_meta.json')))
          want = {'post_cutover': 4, 'n_trades_condors': 3, 'n_bots': 3, 'total_pnl': 500.0}
          for k, v in want.items():
            got = (meta.get('counts', {}) if k == 'post_cutover' else meta).get(k)
            if got != v:
              print(f'ledger_meta.json: {k} want {v}, got {got}', file=sys.stderr)
              sys.exit(1)
          if len(trades) != 4:
            print(f'data/trades.csv: want 4 legs, got {len(trades)}', file=sys.stderr)
            sys.exit(1)
          PY

      - name: run daily.sh twice against the scratch root and diff outputs
        env:
          TAPE_FIXTURE: '1'
          SOURCE_DATE_EPOCH: '1786320000'
          FLEET_ROOT: /tmp/fleet-scratch
        run: |
          set -euo pipefail
          # Both runs use the SAME scratch root and it is NOT re-seeded between
          # them: run 2 must see run 1's output, or this stops testing the
          # accumulators (hedge_tournament.csv, lessons.csv) for idempotency and
          # only tests two independent from-clean builds.
          # G-5: the receipts log is append-only, so it is the one output that
          # MUST differ between the two runs. Snapshot it instead of diffing it.
          RCPT="$FLEET_ROOT/data/receipts/daily-runs.jsonl"
          BEFORE=0
          if [ -f "$RCPT" ]; then BEFORE=$(wc -l < "$RCPT" | tr -d ' '); fi
          # First run
          scripts/daily.sh 2026-08-10
          cp -f "$RCPT" /tmp/receipts-after-run1
          mkdir -p /tmp/run1
          cp -f "$FLEET_ROOT"/data/trades.csv "$FLEET_ROOT"/data/bots.csv \
                "$FLEET_ROOT"/data/straddlers.csv "$FLEET_ROOT"/data/ledger_meta.json \
                "$FLEET_ROOT"/data/execution_audit_findings.csv \
                "$FLEET_ROOT"/data/execution_audit_findings_meta.json \
                "$FLEET_ROOT"/data/hedge_tournament.csv "$FLEET_ROOT"/data/trade_window.csv \
                "$FLEET_ROOT"/data/lessons.csv "$FLEET_ROOT"/data/brief/2026-08-10_brief.json \
                "$FLEET_ROOT"/data/brief/2026-08-10_tape.json \
                "$FLEET_ROOT"/STATUS.md "$FLEET_ROOT"/dashboard.html /tmp/run1/
          # Second run
          scripts/daily.sh 2026-08-10
          # Diff the idempotent outputs.
          # Heartbeat artifacts (artifacts/heartbeat/) are intentionally
          # EXCLUDED from this comparison — they record the run, not the
          # reproducible outputs, and are regenerated fresh each run.
          for f in data/trades.csv data/bots.csv data/straddlers.csv data/ledger_meta.json \
                   data/execution_audit_findings.csv data/execution_audit_findings_meta.json \
                   data/hedge_tournament.csv data/trade_window.csv \
                   data/lessons.csv data/brief/2026-08-10_brief.json \
                   data/brief/2026-08-10_tape.json STATUS.md dashboard.html; do
            if ! diff -q "$FLEET_ROOT/$f" "/tmp/run1/$(basename "$f")" > /dev/null; then
              echo "IDEMPOTENCY FAIL: $f differs between the two daily.sh runs" >&2
              diff "$FLEET_ROOT/$f" "/tmp/run1/$(basename "$f")" >&2 || true
              exit 1
            fi
          done
          echo "daily.sh outputs are identical between the two runs"

          # G-5 ACCEPTANCE — one receipt per run, APPENDED. If run 2 had
          # rewritten the file rather than appending to it, this is what catches
          # it: the receipts log would stop being a history and become another
          # ledger_meta.json, which is the artifact whose overwriting made the
          # 2026-08-12 truncation invisible for five days.
          AFTER=$(wc -l < "$RCPT" | tr -d ' ')
          if [ "$AFTER" -ne "$((BEFORE + 2))" ]; then
            echo "RECEIPT FAIL: expected $((BEFORE + 2)) receipts, found $AFTER" >&2
            exit 1
          fi
          if ! head -c "$(wc -c < /tmp/receipts-after-run1 | tr -d ' ')" "$RCPT" \
               | diff -q - /tmp/receipts-after-run1 > /dev/null; then
            echo "RECEIPT FAIL: run 2 modified run 1's receipt — not append-only" >&2
            exit 1
          fi
          python3 -c "import json,sys; [json.loads(l) for l in open(sys.argv[1])]" "$RCPT"
          echo "receipts: $BEFORE -> $AFTER, append-only, every line valid JSON"

      # Both checks below arrived on master in #13, aimed at data/. Repointed at
      # the scratch root — unchanged in what they assert, and now unable to
      # rebuild the live ledger or corrupt a tracked fixture in order to assert it.
      - name: rerun-and-diff is hermetic under disabled network
        env:
          TAPE_FIXTURE: '1'
          SOURCE_DATE_EPOCH: '1786320000'
          FLEET_ROOT: /tmp/fleet-scratch
        run: |
          set -euo pipefail
          mkdir -p /tmp/run1
          cp -f "$FLEET_ROOT"/data/trades.csv "$FLEET_ROOT"/data/bots.csv \
                "$FLEET_ROOT"/data/straddlers.csv "$FLEET_ROOT"/data/ledger_meta.json \
                "$FLEET_ROOT"/data/execution_audit_findings.csv \
                "$FLEET_ROOT"/data/execution_audit_findings_meta.json \
                "$FLEET_ROOT"/data/hedge_tournament.csv "$FLEET_ROOT"/data/trade_window.csv \
                "$FLEET_ROOT"/data/lessons.csv "$FLEET_ROOT"/data/brief/2026-08-10_brief.json \
                "$FLEET_ROOT"/data/brief/2026-08-10_tape.json \
                "$FLEET_ROOT"/STATUS.md "$FLEET_ROOT"/dashboard.html /tmp/run1/
          run_no_net() {
            if command -v unshare >/dev/null 2>&1 && unshare -n true 2>/dev/null; then
              unshare -n bash scripts/daily.sh 2026-08-10
            else
              echo "unshare not usable; blocking HTTP(S) egress via unreachable proxy" >&2
              HTTP_PROXY=127.0.0.1:1 HTTPS_PROXY=127.0.0.1:1 bash scripts/daily.sh 2026-08-10
            fi
          }
          run_no_net
          for f in data/trades.csv data/bots.csv data/straddlers.csv data/ledger_meta.json \
                   data/execution_audit_findings.csv data/execution_audit_findings_meta.json \
                   data/hedge_tournament.csv data/trade_window.csv \
                   data/lessons.csv data/brief/2026-08-10_brief.json \
                   data/brief/2026-08-10_tape.json STATUS.md dashboard.html; do
            if ! diff -q "$FLEET_ROOT/$f" "/tmp/run1/$(basename "$f")" > /dev/null; then
              echo "NETWORK HERMETICITY FAIL: $f differs when network is disabled" >&2
              diff "$FLEET_ROOT/$f" "/tmp/run1/$(basename "$f")" >&2 || true
              exit 1
            fi
          done
          echo "daily.sh outputs are identical with network disabled"

      - name: corrupted tape fixture is rejected
        env:
          TAPE_FIXTURE: '1'
          FLEET_ROOT: /tmp/fleet-scratch
        run: |
          set -euo pipefail
          # The fixture corrupted here is the SCRATCH root's copy. Deliberately
          # writing 'not-json' over a tracked file in the working tree, then
          # restoring it, is a test that can only pass by leaving no trace — and
          # that is exactly the property nothing was checking on 2026-08-12.
          fixture="$FLEET_ROOT/data/brief/2026-08-10_tape.json"
          cp -f "$fixture" /tmp/orig-fixture.json
          restore() { cp -f /tmp/orig-fixture.json "$fixture" || true; }
          trap restore EXIT
          echo 'not-json' > "$fixture"
          if scripts/daily.sh 2026-08-10; then
            echo "FAIL: daily.sh did not fail on a corrupted fixture" >&2
            exit 1
          fi
          echo "PASS: daily.sh rejected the corrupted tape fixture"

      # THE G-3 ACCEPTANCE TEST. Everything above ran the full pipeline five
      # times, one of them on a deliberately corrupted fixture. If any of it
      # reached the repo, this fails.
      - name: assert the CI runs left the live ledger byte-untouched
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain -- data STATUS.md dashboard.html artifacts)"
          if [ -n "$DIRTY" ]; then
            echo "FIXTURE/LIVE LEAK (G-3): a CI pipeline run modified the repo." >&2
            echo "$DIRTY" >&2
            git diff -- data STATUS.md dashboard.html >&2 || true
            echo "A determinism run must write ONLY its scratch root." >&2
            exit 1
          fi
          echo "data/, STATUS.md, dashboard.html and artifacts/ are byte-untouched"

      - name: check docs vs csv
        run: python3 scripts/check_docs_vs_csv.py

      - name: run-receipt selftest
        run: python3 scripts/run_receipt.py --selftest

      - name: pre-registration ledger parser selftest
        run: python3 scripts/pre_registration_ledger.py

      - name: check_refs row-count invariant selftest
        run: python3 scripts/check_refs.py --selftest

      - name: check refs (ruling IDs + bots_meta row count)
        run: python3 scripts/check_refs.py

  selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: build_ledger selftest
        run: python3 scripts/build_ledger.py --selftest

      - name: a_series selftest
        run: python3 scripts/a_series.py --selftest

      - name: validation suites vs baseline
        run: python3 scripts/ci/validate_all.py


